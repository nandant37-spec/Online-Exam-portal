
services:
  # Backend API
  - type: web
    name: online-exam-portal-api
    runtime: node
    rootDir: online-exam-portal/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: 20

  # Frontend React application
  - type: web
    name: online-exam-portal-client
    runtime: static
    rootDir: online-exam-portal/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
